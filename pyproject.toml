[tool.poetry]
name = "cheeto"
version = "2.7.1"
description = "Utilities for the UC Davis HPC Core Facility."
license = "Proprietary"
authors = [
	"Camille Scott <cswel@ucdavis.edu>"
]
readme = "README.md"
repository = "https://github.com/ucdavis/cheeto"
include = [
	{ path = "cheeto/templates" }
]
packages = [
    { include = "cheeto" }
]

[tool.poetry.scripts]
cheeto = "cheeto.cmds.__main__:main"

[tool.poetry.requires-plugins]
poetry-bumpversion = "^0.3.3"

[tool.poetry_bumpversion.file."cheeto/__init__.py"]

[tool.poetry.dependencies]
python = ">=3.13,<3.16"
rich = "^13.9.2"
ruamel-yaml = "^0.17.21"
marshmallow-dataclass = "^8.7.1"
mergedeep = "^1.3.4"
jinja2 = "^3.1.6"
sh = "^2.0.7"
filelock = ">=3.20.3,<5.0.0"
pymongo = "^4.10.1"
attrs = "^24.2.0"
httpx = "^0.27.0"
python-dateutil = "^2.9.0.post0"
pyescrypt = "^0.1.0"
xkcdpass = "^1.19.9"
ponderosa = "^0.6.0"
marko = "^2.1.2"
ipython = "^8.26.0"
# Upstream beanie pins python <3.14 (BeanieODM/beanie#1357). Our fork relaxes
# requires-python; branch cheeto/py315 on top of the 2.1.0 tag.
beanie = { git = "https://github.com/ucdavis/beanie.git", rev = "d3411b163b2a8297e1d45c85d2d4fca04da6eaae" }
bonsai = "^1.5.0"
celery = "^5.6"   # broker is AMQP; the mongodb result backend only needs pymongo
fastapi = "^0.115"
uvicorn = "^0.34"
flower = "^2.0"   # celery monitoring UI (cheeto daemon flower)

[tool.poetry.group.test.dependencies]
pytest = ">=7.4.4,<10"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
